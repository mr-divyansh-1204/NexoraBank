spring.datasource.url=jdbc:h2:mem:accountdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.cloud.config.enabled=false
internal.api-key=nexora-internal-dev-key

# Test doubles for the Feign call targets (tests mock the clients themselves)
service-urls.user-service=http://localhost:8081
feign.connect-timeout-ms=1000
feign.read-timeout-ms=1000
