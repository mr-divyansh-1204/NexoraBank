spring.application.name=account-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nexora_bank}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Divyansh@42}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# user-service is called over an explicit URL (no discovery). On AWS ECS this
# becomes the Service Connect / Cloud Map DNS name; AWS load-balances across tasks.
service-urls.user-service=${USER_SERVICE_URL:http://localhost:8081}
feign.connect-timeout-ms=3000
feign.read-timeout-ms=5000

internal.api-key=${INTERNAL_API_KEY:nexora-internal-dev-key}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
