spring.application.name=api-gateway
server.port=8080
spring.config.import=optional:configserver:http://localhost:8888

# Service URLs — no service discovery. On AWS ECS, set these to Service Connect /
# Cloud Map DNS names (e.g. http://user-service:8081) and AWS handles load
# balancing across tasks with health-aware routing. Locally, defaults hit
# localhost ports; docker-compose overrides them with container DNS names.
service-urls.user-service=${USER_SERVICE_URL:http://localhost:8081}
service-urls.account-service=${ACCOUNT_SERVICE_URL:http://localhost:8082}
service-urls.transaction-service=${TRANSACTION_SERVICE_URL:http://localhost:8083}
service-urls.notification-service=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=*

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${service-urls.user-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=${service-urls.user-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=${service-urls.account-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/accounts/**

spring.cloud.gateway.routes[3].id=transaction-service
spring.cloud.gateway.routes[3].uri=${service-urls.transaction-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/transactions/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${service-urls.notification-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**

jwt.secret=${JWT_SECRET:NexoraBankJwtSecretKeyThatIsAtLeast32CharsLong!}

management.endpoints.web.exposure.include=health,info
logging.level.org.springframework.cloud.gateway=INFO
