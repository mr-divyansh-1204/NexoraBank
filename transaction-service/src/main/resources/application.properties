spring.application.name=transaction-service
server.port=8083
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nexora_bank}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Divyansh@42}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# account-service is called over an explicit URL (no discovery). On AWS ECS this
# becomes the Service Connect / Cloud Map DNS name; AWS load-balances across tasks.
service-urls.account-service=${ACCOUNT_SERVICE_URL:http://localhost:8082}
feign.connect-timeout-ms=3000
feign.read-timeout-ms=5000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
internal.api-key=${INTERNAL_API_KEY:nexora-internal-dev-key}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
