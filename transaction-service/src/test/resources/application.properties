spring.datasource.url=jdbc:h2:mem:txndb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.cloud.config.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
internal.api-key=nexora-internal-dev-key

# Test doubles for the Feign call target (tests mock the client itself)
service-urls.account-service=http://localhost:8082
feign.connect-timeout-ms=1000
feign.read-timeout-ms=1000
