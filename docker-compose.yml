services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Divyansh@42
      MYSQL_DATABASE: nexora_bank
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      # On ECS these become Service Connect / Cloud Map DNS names — same env vars.
      USER_SERVICE_URL: http://user-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      JWT_SECRET: NexoraBankJwtSecretKeyThatIsAtLeast32CharsLong!
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - notification-service

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/nexora_bank
      MYSQL_USER: root
      MYSQL_PASSWORD: Divyansh@42
      JWT_SECRET: NexoraBankJwtSecretKeyThatIsAtLeast32CharsLong!
      INTERNAL_API_KEY: nexora-internal-dev-key
    depends_on:
      mysql:
        condition: service_healthy

  account-service:
    build: ./account-service
    ports:
      - "8082:8082"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/nexora_bank
      MYSQL_USER: root
      MYSQL_PASSWORD: Divyansh@42
      USER_SERVICE_URL: http://user-service:8081
      INTERNAL_API_KEY: nexora-internal-dev-key
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started

  transaction-service:
    build: ./transaction-service
    ports:
      - "8083:8083"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/nexora_bank
      MYSQL_USER: root
      MYSQL_PASSWORD: Divyansh@42
      ACCOUNT_SERVICE_URL: http://account-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_API_KEY: nexora-internal-dev-key
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/nexora_bank
      MYSQL_USER: root
      MYSQL_PASSWORD: Divyansh@42
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  mysql_data:
