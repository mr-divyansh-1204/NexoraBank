spring.application.name=user-service
server.port=8081
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nexora_bank}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Divyansh@42}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:NexoraBankJwtSecretKeyThatIsAtLeast32CharsLong!}
jwt.expiration-ms=86400000
internal.api-key=${INTERNAL_API_KEY:nexora-internal-dev-key}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
